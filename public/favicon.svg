<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cvBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0d111a"/>
      <stop offset="100%" stopColor="#06080c"/>
    </linearGradient>
    <linearGradient id="cvRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff2a5f"/>
      <stop offset="60%" stopColor="#c9003d"/>
      <stop offset="100%" stopColor="#7a0024"/>
    </linearGradient>
    <linearGradient id="cvTopFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.4"/>
    </linearGradient>
    <linearGradient id="cvLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2c3647"/>
      <stop offset="100%" stopColor="#151b24"/>
    </linearGradient>
    <filter id="cvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#cvBgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Glowing Aura -->
  <circle cx="32" cy="33" r="14" fill="#c9003d" opacity="0.3" filter="url(#cvGlow)"/>

  <!-- 3D Monolithic Hexagonal Prism -->
  <!-- Top Cap (Reflective Frosted Face) -->
  <path d="M32 13 L47 21.5 L32 30 L17 21.5 Z" fill="url(#cvTopFacet)"/>

  <!-- Left Facet (Deep Graphite Architecture) -->
  <path d="M17 21.5 L32 30 V49 L17 40.5 Z" fill="url(#cvLeftFacet)"/>

  <!-- Right Facet (Glowing Ruby Core) -->
  <path d="M32 30 L47 21.5 V40.5 L32 49 Z" fill="url(#cvRubyGrad)"/>

  <!-- Dynamic Precision Chevron Cutout / Core Energy Aperture -->
  <path d="M32 23 L40 27.5 L32 32 L24 27.5 Z" fill="#080a0f" opacity="0.9"/>
  <circle cx="32" cy="27.5" r="2.2" fill="#ffffff"/>
  <circle cx="32" cy="27.5" r="1.1" fill="#ff2a5f"/>
</svg>
