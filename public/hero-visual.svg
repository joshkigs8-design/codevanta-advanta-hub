<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" fill="none">
  <defs>
    <!-- Sky & Atmosphere Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#04060a"/>
      <stop offset="35%" stopColor="#080e18"/>
      <stop offset="65%" stopColor="#0e1726"/>
      <stop offset="85%" stopColor="#1a1424"/>
      <stop offset="100%" stopColor="#24101e"/>
    </linearGradient>

    <radialGradient id="twilightGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stopColor="#c9003d" stopOpacity="0.18"/>
      <stop offset="45%" stopColor="#ff7043" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#04060a" stopOpacity="0"/>
    </radialGradient>

    <radialGradient id="interiorWarmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffe6a3" stopOpacity="0.95"/>
      <stop offset="40%" stopColor="#fca311" stopOpacity="0.75"/>
      <stop offset="80%" stopColor="#c9003d" stopOpacity="0.3"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="waterReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#0a121e" stopOpacity="0.9"/>
      <stop offset="30%" stopColor="#18111e" stopOpacity="0.7"/>
      <stop offset="100%" stopColor="#04060a" stopOpacity="0.98"/>
    </linearGradient>

    <!-- Architecture Materials -->
    <linearGradient id="beamDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10151f"/>
      <stop offset="50%" stopColor="#1b2433"/>
      <stop offset="100%" stopColor="#0a0e16"/>
    </linearGradient>

    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.15"/>
      <stop offset="50%" stopColor="#38bdf8" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0.4"/>
    </linearGradient>

    <filter id="softGaze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="fogBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Base Night Sky -->
  <rect width="2400" height="1350" fill="url(#skyGrad)"/>
  <rect width="2400" height="1350" fill="url(#twilightGlow)"/>

  <!-- Subtle Distant Stars & Data Particles -->
  <g opacity="0.6">
    <circle cx="280" cy="180" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="450" cy="90" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="720" cy="140" r="1.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="950" cy="70" r="1.2" fill="#38bdf8" opacity="0.9"/>
    <circle cx="1280" cy="110" r="2" fill="#ffffff" opacity="0.85"/>
    <circle cx="1520" cy="85" r="1.2" fill="#ffffff" opacity="0.6"/>
    <circle cx="1780" cy="160" r="1.7" fill="#fca311" opacity="0.75"/>
    <circle cx="2040" cy="95" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="2210" cy="175" r="1.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="340" cy="260" r="1.2" fill="#ffffff" opacity="0.4"/>
    <circle cx="880" cy="220" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="1640" cy="210" r="1.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="1920" cy="240" r="1.2" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Distant Layer 1: Atmospheric Mountain Ridges -->
  <path d="M0 680 Q320 540 680 590 T1420 560 Q1800 510 2120 580 T2400 630 V1350 H0 Z" fill="#070c15" opacity="0.7"/>
  <path d="M0 720 Q480 620 980 660 T1880 630 Q2150 610 2400 670 V1350 H0 Z" fill="#0a101b" opacity="0.85"/>

  <!-- Midground Pine / Forest Silhouette Framing (Left & Right) -->
  <!-- Left Ridge Trees -->
  <g fill="#06090e" opacity="0.92">
    <path d="M-40 850 L-10 650 L20 850 Z"/>
    <path d="M30 880 L65 620 L100 880 Z"/>
    <path d="M90 890 L130 580 L170 890 Z"/>
    <path d="M150 910 L195 640 L240 910 Z"/>
    <path d="M220 920 L270 690 L320 920 Z"/>
    <path d="M300 930 L350 720 L400 930 Z"/>
    <path d="M380 940 L430 750 L480 940 Z"/>
  </g>
  <!-- Right Ridge Trees -->
  <g fill="#06090e" opacity="0.92">
    <path d="M1920 940 L1970 730 L2020 940 Z"/>
    <path d="M2000 930 L2050 670 L2100 930 Z"/>
    <path d="M2070 910 L2120 620 L2170 910 Z"/>
    <path d="M2150 890 L2200 580 L2250 890 Z"/>
    <path d="M2230 870 L2280 640 L2330 870 Z"/>
    <path d="M2300 850 L2350 620 L2400 850 Z"/>
    <path d="M2370 840 L2420 590 L2470 840 Z"/>
  </g>

  <!-- Ambient Mist Layer across base -->
  <ellipse cx="1200" cy="740" rx="900" ry="120" fill="#0f1929" opacity="0.45" filter="url(#fogBlur)"/>

  <!-- ========================================================================= -->
  <!-- THE MODERNIST ARCHITECTURAL DEVELOPER PAVILION (CENTRAL HERO MONOLITH)    -->
  <!-- ========================================================================= -->

  <!-- Terrace Foundation & Water Basin / Ground Deck -->
  <polygon points="360,930 2040,930 2160,1180 240,1180" fill="#080c13"/>
  <line x1="360" y1="930" x2="2040" y2="930" stroke="#1f2c3f" stroke-width="2"/>

  <!-- Warm Exterior Terrace Uplighting Glow -->
  <ellipse cx="780" cy="930" rx="140" ry="25" fill="#fca311" opacity="0.25" filter="url(#softGaze)"/>
  <ellipse cx="1200" cy="930" rx="280" ry="35" fill="#fca311" opacity="0.3" filter="url(#softGaze)"/>
  <ellipse cx="1620" cy="930" rx="140" ry="25" fill="#c9003d" opacity="0.2" filter="url(#softGaze)"/>

  <!-- Upper Cantilevered Roof Deck / Overhang -->
  <polygon points="460,540 1940,540 1980,570 420,570" fill="url(#beamDark)"/>
  <rect x="420" y="566" width="1560" height="8" fill="#05070a"/>
  <!-- Sleek Red Laser Accent Line along the Roof Edge -->
  <line x1="420" y1="568" x2="1980" y2="568" stroke="#ef174e" stroke-width="2.5" opacity="0.85"/>

  <!-- Upper Story Glass Volumes (Research Lofts) -->
  <!-- Room 1 Left -->
  <rect x="520" y="574" width="380" height="150" fill="#0d1420"/>
  <rect x="530" y="582" width="360" height="134" fill="url(#interiorWarmth)" opacity="0.4"/>
  <!-- Room 2 Center (Main Tech Hub / Terminal) -->
  <rect x="940" y="574" width="520" height="150" fill="#0d1420"/>
  <rect x="950" y="582" width="500" height="134" fill="url(#interiorWarmth)" opacity="0.75"/>
  <!-- Room 3 Right -->
  <rect x="1500" y="574" width="380" height="150" fill="#0d1420"/>
  <rect x="1510" y="582" width="360" height="134" fill="url(#interiorWarmth)" opacity="0.5"/>

  <!-- Architectural Glass Mullions & Server Glows (Upper Level) -->
  <g stroke="#1a2536" stroke-width="3">
    <line x1="620" y1="574" x2="620" y2="724"/>
    <line x1="720" y1="574" x2="720" y2="724"/>
    <line x1="820" y1="574" x2="820" y2="724"/>
    <line x1="1060" y1="574" x2="1060" y2="724"/>
    <line x1="1200" y1="574" x2="1200" y2="724"/>
    <line x1="1340" y1="574" x2="1340" y2="724"/>
    <line x1="1620" y1="574" x2="1620" y2="724"/>
    <line x1="1740" y1="574" x2="1740" y2="724"/>
  </g>

  <!-- Server status micro-lights inside upper rooms -->
  <g opacity="0.9">
    <circle cx="1020" cy="650" r="2.5" fill="#10b981"/>
    <circle cx="1020" cy="662" r="2.5" fill="#38bdf8"/>
    <circle cx="1020" cy="674" r="2.5" fill="#10b981"/>
    <circle cx="1240" cy="630" r="2.5" fill="#ef174e"/>
    <circle cx="1240" cy="642" r="2.5" fill="#10b981"/>
    <circle cx="1400" cy="660" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Middle Mezzanine Floor Slab -->
  <polygon points="400,724 2000,724 2040,750 360,750" fill="url(#beamDark)"/>
  <line x1="360" y1="750" x2="2040" y2="750" stroke="#253347" stroke-width="2"/>

  <!-- Lower Story Floor-to-Ceiling Luxury Glass Pavilion -->
  <!-- Main Grand Hall (Lines 750 to 930) -->
  <rect x="440" y="750" width="1520" height="180" fill="#090e17"/>
  <!-- Vast Warm Ambient Interior Glow -->
  <rect x="460" y="756" width="1480" height="168" fill="url(#interiorWarmth)" opacity="0.85"/>

  <!-- Architectural Columns (Vertical Heavy Dark Steel Supports) -->
  <g fill="url(#beamDark)">
    <rect x="440" y="750" width="28" height="180"/>
    <rect x="680" y="750" width="22" height="180"/>
    <rect x="920" y="750" width="22" height="180"/>
    <rect x="1180" y="750" width="26" height="180"/>
    <rect x="1440" y="750" width="22" height="180"/>
    <rect x="1700" y="750" width="22" height="180"/>
    <rect x="1932" y="750" width="28" height="180"/>
  </g>

  <!-- Glass Panes & Reflections -->
  <g opacity="0.45">
    <polygon points="480,756 560,756 520,924 460,924" fill="url(#glassFacet)"/>
    <polygon points="720,756 820,756 760,924 690,924" fill="url(#glassFacet)"/>
    <polygon points="960,756 1090,756 1020,924 930,924" fill="url(#glassFacet)"/>
    <polygon points="1220,756 1350,756 1280,924 1190,924" fill="url(#glassFacet)"/>
    <polygon points="1480,756 1610,756 1540,924 1450,924" fill="url(#glassFacet)"/>
    <polygon points="1740,756 1870,756 1800,924 1710,924" fill="url(#glassFacet)"/>
  </g>

  <!-- Warm Downlight Cones from Ceiling -->
  <g opacity="0.35" filter="url(#softGaze)">
    <polygon points="580,750 510,870 650,870" fill="#fca311"/>
    <polygon points="800,750 730,870 870,870" fill="#ffe6a3"/>
    <polygon points="1050,750 970,880 1130,880" fill="#fca311"/>
    <polygon points="1310,750 1230,880 1390,880" fill="#ffe6a3"/>
    <polygon points="1570,750 1490,870 1650,870" fill="#fca311"/>
    <polygon points="1820,750 1750,870 1890,870" fill="#ffe6a3"/>
  </g>

  <!-- Foreground Reflective Basin / Polished Granite Forecourt -->
  <rect x="0" y="1040" width="2400" height="310" fill="url(#waterReflection)"/>
  <!-- Ambient Mirror Reflection of the Illuminated Pavilion -->
  <g opacity="0.3" filter="url(#softGaze)">
    <ellipse cx="1200" cy="1120" rx="650" ry="80" fill="#fca311"/>
    <ellipse cx="1200" cy="1200" rx="450" ry="60" fill="#c9003d"/>
  </g>

  <!-- Cinematic Deep Vignette and Atmospheric Frame -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="40%" stopColor="#000000" stopOpacity="0"/>
    <stop offset="85%" stopColor="#04060a" stopOpacity="0.75"/>
    <stop offset="100%" stopColor="#020306" stopOpacity="0.95"/>
  </radialGradient>
  <rect width="2400" height="1350" fill="url(#vignette)"/>
</svg>

